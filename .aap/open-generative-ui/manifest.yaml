apiVersion: aap.cockpit.io/v1
kind: Module
metadata:
  name: open-generative-ui
  description: >
    A generative UI agent that helps users understand CopilotKit and LangGraph,
    produces rich interactive visual responses, and manages reusable UI templates.
spec:
  agents:
    - id: main-agent
      name: Open Generative UI Agent
      instruction: agents/main-agent.md
      model: gpt-5.4-2026-03-05
      tools:
        - query_data
        - manage_todos
        - get_todos
        - generate_form
        - save_template
        - list_templates
        - apply_template
        - delete_template
        - clear_pending_template

  connections:
    - id: agent-backend
      type: http
      url: "http://localhost:8000"
    - id: mcp-server
      type: mcp
      url: "http://localhost:3001/mcp"

  artifacts:
    - id: open-generative-ui.config.model
      type: json
      value:
        default: "gpt-5.4-2026-03-05"
        fallback: "gpt-4o"
